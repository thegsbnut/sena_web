<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SENA Court · สมาชิก LINE</title><link rel="stylesheet" href="/billing.css"></head><body><header><strong>SENA Court</strong><a href="/court#booking">ดูตาราง</a></header><main><h1 id="title">เข้าสู่ระบบด้วย LINE</h1><p id="message" role="status">กำลังตรวจสอบบัญชี…</p><div id="actions"></div><dialog id="mapping" aria-labelledby="mappingTitle"><h2 id="mappingTitle">เลือกชื่อผู้เล่นของคุณ</h2><p>ผูกกับชื่อเดิมเพื่อใช้ประวัติเดิม หรือสมัครชื่อใหม่ ผู้จัดตรวจสอบครั้งแรกก่อนเปิดสิทธิ์จอง</p><form id="mapForm"><label>รายชื่อเดิม<select id="existing"><option value="">สมัครชื่อใหม่</option></select></label><label id="newNameLabel">ชื่อที่ใช้ในก๊วน<input id="newName" maxlength="80" autocomplete="nickname"></label><p>ชื่อในก๊วนใช้แสดงตารางและบิล แยกจากชื่อโปรไฟล์ LINE ผู้จัดแก้ชื่อให้ได้</p><button class="primary" type="submit">ส่งให้ผู้จัดตรวจสอบ</button></form><p id="mapStatus" role="status"></p></dialog></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="/liff.js"></script></body></html>
